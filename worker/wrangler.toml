name = "tiles"
main = "src/index.js"
# The OAuth token can see more than one account since 2026-10; pin ours so
# non-interactive deploys do not stop at the account picker.
account_id = "ad20eec906d1b5a42931b881ed22232f"
# Runtime behavior date. Raised from 2025-05-01 on 2026-10-07 after both Workers
# answered a request battery identically under either date in workerd 2026-10-06.
compatibility_date = "2026-10-06"
# No tiles.<account>.workers.dev hostname: it would expose the whole charts
# bucket outside the archive.aero zone (WAF, cache namespace) and defaults to
# enabled on every deploy when unset.
workers_dev = false
# No per-version preview hostnames (<version>-<name>.<account>.workers.dev):
# left unset, the account default applies, and a preview URL bypasses the
# zone (WAF, routes) just like the workers.dev hostname.
preview_urls = false

# Custom domain attaches via dashboard or `routes` block.
# routes = [{ pattern = "tiles.archive.aero", custom_domain = true }]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "charts"

# The reslice's content-hashed archives and the next/ files (manifest, pins,
# chart index, airports) are served from the bucket they were uploaded to
# (2026-10-12 decision: no 359 GB copy). The name is historical: it was the
# beta's bucket; it is production's immutable store now. src/index.js
# bucketFor() routes hashed keys and next/* here, everything else to BUCKET.
[[r2_buckets]]
binding = "BUCKET_HASHED"
bucket_name = "charts-beta"

[[analytics_engine_datasets]]
binding = "TILES"
dataset = "tile_logs"

# Every response >= 400 and every uncaught exception, unsampled (tile_logs
# holds only sampled successful tile reads). See logFailure in src/index.js.
[[analytics_engine_datasets]]
binding = "TILE_ERRORS"
dataset = "tile_errors"

[vars]
ALLOWED_ORIGIN = "*"
SAMPLE_RATE = "0.05"
METADATA_BYTES = "1024"
# Deploy this revision after the completed permanent chart/era refresh and timeline upload.
# It retires old edge blocks without changing any public chart address.
CHART_CACHE_VERSION = "2026-10-13-eighties"

# Workers Logs: keep sampled invocation logs (incl. console.error and uncaught
# exceptions) queryable in the dashboard — without this, error bursts like the
# 2026-07-15 500-storm leave no messages behind.
[observability]
enabled = true
head_sampling_rate = 0.1
